; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = harness_check_ascon

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
;build_unflags = -Os ; Uncomment and set a different optimization flag in build_flags.
build_flags = -Os
              -D BAUD=9600
[ascon]
lib_ignore = TinyJAMBU
             Xoodyak
build_flags = ${env.build_flags}
              -D USE_ASCON_IMPL=2 ; 1=opt8, 2=avr; NOTE: THIS ONLY CHANGES THE PRINTED MESSAGES, TO SWITCH THE IMPLEMENTATION ALSO CHANGE IN 'ascon/library.json'  THE 'srcDir' and 'includeDir' TO 'opt8'/'avr'

[env:harness_check_ascon]
lib_ignore = ${ascon.lib_ignore}
build_flags = ${ascon.build_flags}
              -D HARNESS_CHECK=1
              -D USE_ASCON=1

[env:flash_harness_ascon]
lib_ignore = ${ascon.lib_ignore}
build_flags = ${ascon.build_flags}
              -D FLASH_CHECK=1
              -D USE_ASCON=0

[env:flash_ascon]
lib_ignore = ${ascon.lib_ignore}
build_flags = ${ascon.build_flags}
              -D FLASH_CHECK=1
              -D USE_ASCON=1

[env:timing_ascon]
lib_ignore = ${ascon.lib_ignore}
build_flags = ${ascon.build_flags}
              -D TIMING_CHECK=1
              -D USE_ASCON=1

[env:ram_harness_ascon]
lib_ignore = ${ascon.lib_ignore}
build_flags = ${ascon.build_flags}
              -D RAM_CHECK=1
              -D USE_ASCON=0

[env:ram_ascon]
lib_ignore = ${ascon.lib_ignore}
build_flags = ${ascon.build_flags}
              -D RAM_CHECK=1
              -D USE_ASCON=1

[env:harness_check_tinyjambu]
lib_ignore = ascon
             Xoodyak
build_flags = ${env.build_flags}
              -D HARNESS_CHECK=1
              -D USE_TINYJAMBU=1

